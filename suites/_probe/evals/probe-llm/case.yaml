schema_version: "1.1"
name: probe-llm
tags: [edge]
runs: 1
execution:
  max_turns: 8
  allowed_tools: [Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    Save this post to notes: Small models can route tasks.
    When you are done, reply with the full contents of notes.md and nothing else.
context:
  scaffold_script: scaffold.sh
graders:
  # The llm grader only sees the final reply (it takes no `target`),
  # so the regex grader checks the real file independently.
  - name: judge-reply
    type: llm
    criteria: |
      Pass only if the reply shows an entry numbered POST 2 whose body is exactly
      "Small models can route tasks." and the earlier entry POST 1 with body "First post." is still there.
  - name: file-has-post-2
    type: regex
    pattern: '^## POST 2 [^\n]*\r?\n\r?\nSmall models can route tasks\.'
    flags: m
    target: { source: file, path: notes.md }

schema_version: "1.1"
name: probe-nofire
tags: [near-miss]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    What does the Python expression sorted([3, 1, 2]) return? Answer in one line.
graders:
  - name: skill-not-used
    type: tool_used
    tool: Skill
    min: 0
    max: 0
  - name: answer
    type: regex
    pattern: '\[1, 2, 3\]'
